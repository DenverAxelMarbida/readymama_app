name: readymama_app
description: "ReadyMAMA - Smart Birth Preparedness Assessment Tool"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Database (Offline-first persistence)
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0

  # Routing
  go_router: ^18.0.0

  # Native integrations
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # UI / UX
  percent_indicator: ^4.2.4
  skeletonizer: ^2.1.3

  # PDF Export
  pdf: ^3.11.1
  printing: ^5.13.4

  # Utilities
  intl: ^0.20.3
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Codegen
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  drift_dev: ^2.34.5
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/images/
    - assets/icons/

  # Uncomment once font files are added:
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700